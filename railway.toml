# Railway service configuration.
# Build is auto-detected from the Dockerfile in the repo root.
# Required env vars on this service:
#   STORAGE_BACKEND          — `r2` in production
#   R2_ENDPOINT_URL          — https://<account-id>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID         — Cloudflare R2 token credentials
#   R2_SECRET_ACCESS_KEY     — Cloudflare R2 token credentials
#   R2_BUCKET                — Cloudflare R2 bucket name
#   PORT                     — 8000 (pin so the public proxy target matches)
#
# Bundle TTL is enforced by R2 lifecycle rules on the bucket, not by this app.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
